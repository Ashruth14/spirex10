<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
<h1>Image Gallery</h1>

<div class="filters">
<button class="active" onclick="filterImages('all')">All</button>
<button onclick="filterImages('nature')">Nature</button>
<button onclick="filterImages('animals')">Animals</button>
<button onclick="filterImages('city')">City</button>
</div>

<div class="gallery">
<div class="image nature">
<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" onclick="openImage(this)">
</div>
<div class="image animals">
<img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d" onclick="openImage(this)">
</div>
<div class="image city">
<img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df" onclick="openImage(this)">
</div>
<div class="image nature">
<img src="https://images.unsplash.com/photo-1501854140801-50d01698950b" onclick="openImage(this)">
</div>
<div class="image animals">
<img src="https://images.unsplash.com/photo-1552053831-71594a27632d" onclick="openImage(this)">
</div>
<div class="image city">
<img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390" onclick="openImage(this)">
</div>
<div class="image nature">
<img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" onclick="openImage(this)">
</div>
<div class="image animals">
<img src="https://images.unsplash.com/photo-1517849845537-4d257902454a" onclick="openImage(this)">
</div>
<div class="image city">
<img src="https://images.unsplash.com/photo-1514565131-fce0801e5785" onclick="openImage(this)">
</div>
</div>
</div>

<div class="modal" id="modal">
<span class="close" onclick="closeImage()">&times;</span>
<button class="prev" onclick="changeImage(-1)">&#10094;</button>
<img id="preview">
<button class="next" onclick="changeImage(1)">&#10095;</button>
</div>

<script src="script.js"></script>
</body>
</html>
